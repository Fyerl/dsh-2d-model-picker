name: Bug report
description: Report a problem
labels: [bug]
body:
  - type: input
    id: dsh
    attributes:
      label: DSH version
      placeholder: For example, 0.2.1-rc.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
