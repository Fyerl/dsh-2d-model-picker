name: Bug report
description: 报告一个缺陷
labels: [bug]
body:
  - type: input
    id: dsh
    attributes:
      label: DSH 版本
      placeholder: 例如 0.2.1-rc.5
  - type: input
    id: os
    attributes:
      label: 操作系统
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
