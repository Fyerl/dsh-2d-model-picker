name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify without publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.archive.outputs.name }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
      - name: Verify release archive against the tagged npm package
        id: archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [[ "$RELEASE_TAG" != "v$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable release tag matching package.json (v$version)"
            exit 1
          fi

          archive="$name-$version.tgz"
          gh release download "$RELEASE_TAG" --pattern "$archive" --dir "$RUNNER_TEMP"

          # Compare package contents without relying on tar metadata or gzip output.
          npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          node -p 'require(process.argv[1])[0].files.map(({ path }) => "package/" + path).join("\n")' \
            "$RUNNER_TEMP/npm-pack.json" | LC_ALL=C sort > "$RUNNER_TEMP/npm-files"
          tar -tzf "$RUNNER_TEMP/$archive" | LC_ALL=C sort | diff -u "$RUNNER_TEMP/npm-files" -
          while IFS= read -r member; do
            tar -xOf "$RUNNER_TEMP/$archive" "$member" | cmp - "${member#package/}"
          done < "$RUNNER_TEMP/npm-files"

          echo "name=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'release'
        with:
          name: npm-release-package
          path: ${{ runner.temp }}/${{ steps.archive.outputs.name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-package
      - name: Publish the verified archive
        env:
          ARCHIVE: ${{ needs.verify.outputs.archive }}
        run: npm publish "./$ARCHIVE" --access public
